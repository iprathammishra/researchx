<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 465" role="img" aria-labelledby="title desc">
<title id="title">Observation, release and revision are different dates</title>
<desc id="desc">In a fictional example, the period ends on 31 December, a first release is available on 15 February, the decision is on 1 March, and a revision arrives on 15 April. Use the February version at the March decision; the April revision cannot be backfilled. The timeline is not to scale.</desc>
<metadata>{&quot;kind&quot;: &quot;illustrative timeline&quot;, &quot;notToScale&quot;: true, &quot;events&quot;: [{&quot;id&quot;: &quot;period-end&quot;, &quot;date&quot;: &quot;2026-12-31&quot;, &quot;role&quot;: &quot;observation&quot;}, {&quot;id&quot;: &quot;original-release&quot;, &quot;date&quot;: &quot;2027-02-15&quot;, &quot;role&quot;: &quot;available&quot;}, {&quot;id&quot;: &quot;decision-cutoff&quot;, &quot;date&quot;: &quot;2027-03-01&quot;, &quot;role&quot;: &quot;decision&quot;}, {&quot;id&quot;: &quot;revision&quot;, &quot;date&quot;: &quot;2027-04-15&quot;, &quot;role&quot;: &quot;unavailable at decision&quot;}]}</metadata>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#222" stroke-width="1.4"/></marker></defs>
<rect width="760" height="465" fill="white"/>
<g fill="none" stroke="#222" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
<path d="M65 285H705" id="calendar-time" marker-end="url(#arrow)"/><path d="M431 80V321" id="decision-cutoff" stroke-dasharray="6 7"/><path d="M86 277V293"/><path d="M323 277V293"/><path d="M431 277V293"/><path d="M630 277V293"/><rect id="period-end" x="43" y="105" width="185" height="100" rx="3" fill="white"/><rect id="original-release" x="243" y="150" width="161" height="98" rx="3" fill="white"/><rect id="revision" x="534" y="105" width="183" height="100" rx="3" fill="white"/><path d="M86 205V270" id="observation-date" marker-end="url(#arrow)"/><path d="M323 248V270" id="release-date" marker-end="url(#arrow)"/><path d="M630 205V270" id="revision-date" marker-end="url(#arrow)"/><path d="M404 199H431" id="available-at-T" marker-end="url(#arrow)"/><path d="M534 228H482" id="blocked-backfill" marker-end="url(#arrow)"/><path d="M496 213L516 243 M516 213L496 243"/>
</g>
<g fill="#222" font-family="-apple-system,BlinkMacSystemFont,Arial,sans-serif">
<text x="43" y="43" font-size="23" text-anchor="start" font-weight="400">“December data” can arrive in February.</text><text x="57" y="139" font-size="20" text-anchor="start" font-weight="500">Period described</text><text x="57" y="174" font-size="19" text-anchor="start" font-weight="400">Ends 31 Dec</text><text x="255" y="181" font-size="20" text-anchor="start" font-weight="500">First release</text><text x="255" y="215" font-size="18" text-anchor="start" font-weight="400">Available now</text><text x="548" y="139" font-size="20" text-anchor="start" font-weight="500">Later revision</text><text x="548" y="174" font-size="19" text-anchor="start" font-weight="400">Keep separate</text><text x="86" y="325" font-size="19" text-anchor="middle" font-weight="400">31 Dec</text><text x="323" y="325" font-size="19" text-anchor="middle" font-weight="400">15 Feb</text><text x="630" y="325" font-size="19" text-anchor="middle" font-weight="400">15 Apr</text><text x="431" y="72" font-size="20" text-anchor="middle" font-weight="500">T = 1 Mar</text><text x="431" y="354" font-size="18" text-anchor="middle" font-weight="400">Decision</text><text x="43" y="394" font-size="20" text-anchor="start" font-weight="400">At T: use the February version, not the April revision.</text><text x="43" y="429" font-size="18" text-anchor="start" font-weight="400">Fictional dates · not to scale · dashed line = decision cutoff</text>
</g>
</svg>
