<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 320" role="img" aria-labelledby="title desc">
<title id="title">A sustainable week</title><desc id="desc">A seven-day calendar contains a few completed study blocks, open spaces and an arrow into the following week.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#222" stroke-width="1.3"/></marker></defs>
<rect width="760" height="320" fill="white"/>
<g fill="none" stroke="#222" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="110" y="74" width="420" height="172" /><path d="M110 108L530 108" /><path d="M170 74L170 246" /><path d="M230 74L230 246" /><path d="M290 74L290 246" /><path d="M350 74L350 246" /><path d="M410 74L410 246" /><path d="M470 74L470 246" /><rect x="123" y="129" width="34" height="48" /><path d="M131 154L138 161L151 142" /><rect x="183" y="162" width="34" height="48" /><path d="M191 187L198 194L211 175" /><rect x="303" y="129" width="34" height="48" /><path d="M311 154L318 161L331 142" /><rect x="423" y="162" width="34" height="48" /><path d="M431 187L438 194L451 175" /><path d="M560 151Q641 151 641 212Q641 262 552 262" marker-end="url(#arrow)"/></g>
<g fill="#222" font-family="-apple-system,BlinkMacSystemFont,Arial,sans-serif"><text x="110" y="40" font-size="20" text-anchor="start" font-weight="400">A week you can repeat.</text><text x="140" y="96" font-size="14" text-anchor="middle" font-weight="400">M</text><text x="200" y="96" font-size="14" text-anchor="middle" font-weight="400">T</text><text x="260" y="96" font-size="14" text-anchor="middle" font-weight="400">W</text><text x="320" y="96" font-size="14" text-anchor="middle" font-weight="400">T</text><text x="380" y="96" font-size="14" text-anchor="middle" font-weight="400">F</text><text x="440" y="96" font-size="14" text-anchor="middle" font-weight="400">S</text><text x="500" y="96" font-size="14" text-anchor="middle" font-weight="400">S</text><text x="554" y="119" font-size="16" text-anchor="start" font-weight="400">Repeat</text><text x="110" y="283" font-size="15" text-anchor="start" font-weight="400">Leave room for work, rest and difficult questions.</text></g></svg>