<rect x="155" y="159" width="190" height="27" fill="white" stroke="none"/><rect x="411" y="229" width="198" height="27" fill="white" stroke="none"/><rect x="243" y="299" width="274" height="27" fill="white" stroke="none"/><rect x="161" y="369" width="178" height="27" fill="white" stroke="none"/>
</g>
<g fill="#222" font-family="-apple-system,BlinkMacSystemFont,Arial,sans-serif">
<text x="40" y="42" font-size="22" text-anchor="start" font-weight="400">A citation gives the analyst something to check.</text><text x="120" y="120" font-size="20" text-anchor="middle" font-weight="500">Analyst</text><text x="380" y="120" font-size="20" text-anchor="middle" font-weight="500">Retrieval</text><text x="640" y="120" font-size="20" text-anchor="middle" font-weight="500">Drafting model</text><text x="250" y="181" font-size="19" text-anchor="middle" font-weight="400">1  Ask a question</text><text x="510" y="251" font-size="19" text-anchor="middle" font-weight="400">2  Dated passages</text><text x="380" y="321" font-size="19" text-anchor="middle" font-weight="400">3  Draft + page citations</text><text x="250" y="391" font-size="19" text-anchor="middle" font-weight="400">4  Open originals</text><text x="380" y="481" font-size="20" text-anchor="middle" font-weight="400">Verify numbers and context.</text><text x="380" y="507" font-size="19" text-anchor="middle" font-weight="400">Evidence missing? Say so.</text><text x="40" y="570" font-size="18" text-anchor="start" font-weight="400">Suggested message order; spacing does not measure time.</text>
</g>
