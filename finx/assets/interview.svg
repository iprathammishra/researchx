<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 625" role="img" aria-labelledby="title desc">
<title id="title">A retention recommendation with an uncertainty branch</title>
<desc id="desc">The retention case estimates net value of 100,000 rupees and a break-even incremental retention lift of 1.33 percentage points. If evidence supports positive net value, consider a monitored controlled rollout. If unclear, collect evidence. If it does not support positive value, revise or stop.</desc>
<metadata>{&quot;kind&quot;: &quot;illustrative decision tree&quot;, &quot;case&quot;: &quot;retention&quot;, &quot;assumptions&quot;: {&quot;customers&quot;: 10000, &quot;costPerContactINR&quot;: 20, &quot;estimatedLift&quot;: 0.02, &quot;contributionPerRetainedINR&quot;: 1500}, &quot;nodes&quot;: [&quot;economics&quot;, &quot;evidence-check&quot;, &quot;conditional-rollout&quot;, &quot;resolve-uncertainty&quot;, &quot;revise-or-stop&quot;], &quot;edges&quot;: [{&quot;id&quot;: &quot;check-evidence&quot;, &quot;from&quot;: &quot;economics&quot;, &quot;to&quot;: &quot;evidence-check&quot;}, {&quot;id&quot;: &quot;supported&quot;, &quot;from&quot;: &quot;evidence-check&quot;, &quot;to&quot;: &quot;conditional-rollout&quot;, &quot;condition&quot;: &quot;yes&quot;}, {&quot;id&quot;: &quot;unknown&quot;, &quot;from&quot;: &quot;evidence-check&quot;, &quot;to&quot;: &quot;resolve-uncertainty&quot;, &quot;condition&quot;: &quot;unclear&quot;}, {&quot;id&quot;: &quot;unsupported&quot;, &quot;from&quot;: &quot;evidence-check&quot;, &quot;to&quot;: &quot;revise-or-stop&quot;, &quot;condition&quot;: &quot;no&quot;}]}</metadata>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#222" stroke-width="1.4"/></marker></defs>
<rect width="760" height="625" fill="white"/>
<g fill="none" stroke="#222" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
<rect id="economics" x="45" y="85" width="335" height="107" rx="3" fill="white"/><rect id="evidence-check" x="45" y="260" width="335" height="104" rx="3" fill="white"/><rect id="conditional-rollout" x="487" y="85" width="226" height="86" rx="3" fill="white"/><rect id="resolve-uncertainty" x="487" y="260" width="226" height="86" rx="3" fill="white"/><rect id="revise-or-stop" x="487" y="435" width="226" height="86" rx="3" fill="white"/><path d="M212 192V260" id="check-evidence" marker-end="url(#arrow)"/><path d="M380 279H423V128H487" id="supported" marker-end="url(#arrow)"/><path d="M380 311H487" id="unknown" marker-end="url(#arrow)"/><path d="M380 343H423V478H487" id="unsupported" marker-end="url(#arrow)"/>
</g>
<g fill="#222" font-family="-apple-system,BlinkMacSystemFont,Arial,sans-serif">
<text x="45" y="43" font-size="22" text-anchor="start" font-weight="400">A positive estimate still needs a decision rule.</text><text x="62" y="119" font-size="20" text-anchor="start" font-weight="500">Case 1 · retention campaign</text><text x="62" y="151" font-size="20" text-anchor="start" font-weight="400">Estimated net: +₹100,000</text><text x="62" y="179" font-size="19" text-anchor="start" font-weight="400">Break-even lift: 1.33 pp</text><text x="62" y="298" font-size="20" text-anchor="start" font-weight="400">Does the evidence support</text><text x="62" y="327" font-size="20" text-anchor="start" font-weight="400">positive net value?</text><text x="600" y="123" font-size="20" text-anchor="middle" font-weight="500">Controlled rollout</text><text x="600" y="151" font-size="19" text-anchor="middle" font-weight="400">Monitor the effect</text><text x="600" y="299" font-size="20" text-anchor="middle" font-weight="500">Collect evidence</text><text x="600" y="327" font-size="19" text-anchor="middle" font-weight="400">Resolve uncertainty</text><text x="600" y="474" font-size="20" text-anchor="middle" font-weight="500">Revise or stop</text><text x="600" y="502" font-size="19" text-anchor="middle" font-weight="400">Recheck economics</text><text x="438" y="116" font-size="18" text-anchor="start" font-weight="400">Yes</text><text x="412" y="300" font-size="18" text-anchor="start" font-weight="400">Unclear</text><text x="438" y="466" font-size="18" text-anchor="start" font-weight="400">No</text><text x="45" y="564" font-size="19" text-anchor="start" font-weight="400">2 pp lift is a case estimate; 1.33 pp is arithmetic,</text><text x="45" y="590" font-size="19" text-anchor="start" font-weight="400">not proof that the campaign will pay off.</text>
</g>
</svg>
