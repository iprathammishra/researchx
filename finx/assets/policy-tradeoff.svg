<title id="title">Compare three lending policy scenarios</title>
<desc id="desc">Three illustrative policy points have approval rates of 40, 60 and 80 percent and expected contributions of 4, 6 and 3 lakh rupees respectively. Both axes start at zero. The points are separate scenarios, not a fitted curve or a measured optimum.</desc>
