<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 320" role="img" aria-labelledby="title desc">
<title id="title">The research iceberg</title><desc id="desc">A research result sits above a waterline while data, costs and selection are visible below it.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#222" stroke-width="1.3"/></marker></defs>
<rect width="760" height="320" fill="white"/>
<g fill="none" stroke="#222" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M220 134L312 43L351 96L408 65L474 135L512 219L432 277L359 242L305 288L246 223Z" /><path d="M63 140Q92 132 121 140T180 140T239 140T298 140T357 140T416 140T475 140T534 140T593 140T652 140T711 140" /><path d="M476 88L535 66" /><path d="M492 203L550 203" /></g>
<g fill="#222" font-family="-apple-system,BlinkMacSystemFont,Arial,sans-serif"><text x="542" y="65" font-size="17" text-anchor="start" font-weight="400">Promising result</text><text x="298" y="166" font-size="15" text-anchor="start" font-weight="400">Data</text><text x="339" y="198" font-size="15" text-anchor="start" font-weight="400">Costs</text><text x="294" y="233" font-size="15" text-anchor="start" font-weight="400">Selection</text><text x="556" y="207" font-size="16" text-anchor="start" font-weight="400">What the headline</text><text x="556" y="232" font-size="16" text-anchor="start" font-weight="400">does not show</text><text x="63" y="310" font-size="16" text-anchor="start" font-weight="400">Inspect the assumptions below the surface.</text></g></svg>