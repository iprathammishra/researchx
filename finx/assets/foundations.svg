<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 320" role="img" aria-labelledby="title desc">
<title id="title">The invoice waiting room</title><desc id="desc">A checked profit ledger sits beside unpaid invoices and a clock; a dotted arrow leads toward the bank.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#222" stroke-width="1.3"/></marker></defs>
<rect width="760" height="320" fill="white"/>
<g fill="none" stroke="#222" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="96" y="70" width="153" height="186" /><path d="M114 113H230 M114 150H230 M114 187H230 M114 224H230" /><path d="M187 94L200 105L222 81" /><rect x="303" y="136" width="88" height="106" fill="white" /><rect x="311" y="128" width="88" height="106" fill="white" /><rect x="319" y="120" width="88" height="106" fill="white" /><path d="M332 148H390 M332 164H390" /><circle cx="417" cy="91" r="32" /><path d="M417 68V91L434 103" /><path d="M433 206H517" stroke-dasharray="5 7" marker-end="url(#arrow)"/><rect x="559" y="141" width="124" height="102" /><path d="M551 141L621 102L691 141 M579 159V221 M604 159V221 M637 159V221 M662 159V221 M551 243H691" /></g>
<g fill="#222" font-family="-apple-system,BlinkMacSystemFont,Arial,sans-serif"><text x="105" y="50" font-size="17" text-anchor="start" font-weight="400">Profit recorded</text><text x="323" y="270" font-size="16" text-anchor="start" font-weight="400">Receivables</text><text x="572" y="275" font-size="16" text-anchor="start" font-weight="400">Cash collected</text><text x="332" y="192" font-size="13" text-anchor="start" font-weight="400">INVOICE</text><text x="85" y="300" font-size="16" text-anchor="start" font-weight="400">The sale happened. The payment has not—yet.</text></g></svg>