<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 415" role="img" aria-labelledby="title desc">
<title id="title">From source to a reviewed recommendation</title>
<desc id="desc">Dated sources lead to validated tables, a baseline comparison, economic stress tests, a memo and review. Unresolved data returns from review to validation.</desc>
<metadata>{&quot;kind&quot;: &quot;suggested workflow&quot;, &quot;nodes&quot;: [&quot;source&quot;, &quot;tables&quot;, &quot;analysis&quot;, &quot;economics&quot;, &quot;memo&quot;, &quot;review&quot;], &quot;edges&quot;: [{&quot;id&quot;: &quot;source-to-tables&quot;, &quot;from&quot;: &quot;source&quot;, &quot;to&quot;: &quot;tables&quot;}, {&quot;id&quot;: &quot;tables-to-analysis&quot;, &quot;from&quot;: &quot;tables&quot;, &quot;to&quot;: &quot;analysis&quot;}, {&quot;id&quot;: &quot;analysis-to-economics&quot;, &quot;from&quot;: &quot;analysis&quot;, &quot;to&quot;: &quot;economics&quot;}, {&quot;id&quot;: &quot;economics-to-memo&quot;, &quot;from&quot;: &quot;economics&quot;, &quot;to&quot;: &quot;memo&quot;}, {&quot;id&quot;: &quot;memo-to-review&quot;, &quot;from&quot;: &quot;memo&quot;, &quot;to&quot;: &quot;review&quot;}, {&quot;id&quot;: &quot;repair-data&quot;, &quot;from&quot;: &quot;review&quot;, &quot;to&quot;: &quot;tables&quot;}]}</metadata>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#222" stroke-width="1.4"/></marker></defs>
<rect width="760" height="415" fill="white"/>
<g fill="none" stroke="#222" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
<rect id="source" x="40" y="100" width="190" height="88" rx="3" fill="white"/><rect id="tables" x="285" y="100" width="190" height="88" rx="3" fill="white"/><rect id="analysis" x="530" y="100" width="190" height="88" rx="3" fill="white"/><rect id="economics" x="530" y="290" width="190" height="88" rx="3" fill="white"/><rect id="memo" x="285" y="290" width="190" height="88" rx="3" fill="white"/><rect id="review" x="40" y="290" width="190" height="88" rx="3" fill="white"/><path d="M230 144H285" id="source-to-tables" marker-end="url(#arrow)"/><path d="M475 144H530" id="tables-to-analysis" marker-end="url(#arrow)"/><path d="M625 188V290" id="analysis-to-economics" marker-end="url(#arrow)"/><path d="M530 334H475" id="economics-to-memo" marker-end="url(#arrow)"/><path d="M285 334H230" id="memo-to-review" marker-end="url(#arrow)"/><path d="M135 290V228H380V188" id="repair-data" marker-end="url(#arrow)"/>
</g>
<g fill="#222" font-family="-apple-system,BlinkMacSystemFont,Arial,sans-serif">
<text x="40" y="45" font-size="23" text-anchor="start" font-weight="400">Keep the evidence attached to the decision.</text><text x="54" y="134" font-size="20" text-anchor="start" font-weight="500">1  Source</text><text x="54" y="162" font-size="18" text-anchor="start" font-weight="400">Dated sources</text><text x="299" y="134" font-size="20" text-anchor="start" font-weight="500">2  Validate</text><text x="299" y="162" font-size="18" text-anchor="start" font-weight="400">Units · dates</text><text x="544" y="134" font-size="20" text-anchor="start" font-weight="500">3  Compare</text><text x="544" y="162" font-size="18" text-anchor="start" font-weight="400">Baseline + model</text><text x="544" y="324" font-size="20" text-anchor="start" font-weight="500">4  Stress</text><text x="544" y="352" font-size="18" text-anchor="start" font-weight="400">Cost · downside</text><text x="299" y="324" font-size="20" text-anchor="start" font-weight="500">5  Recommend</text><text x="299" y="352" font-size="18" text-anchor="start" font-weight="400">Memo + slides</text><text x="54" y="324" font-size="20" text-anchor="start" font-weight="500">6  Review</text><text x="54" y="352" font-size="18" text-anchor="start" font-weight="400">Challenge evidence</text><text x="207" y="254" font-size="18" text-anchor="start" font-weight="400">Unresolved data? Repair it.</text>
</g>
</svg>
