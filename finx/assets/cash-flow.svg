<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 320" role="img" aria-labelledby="title desc">
<title id="title">A profit-to-cash waterfall</title><desc id="desc">An illustrative waterfall starts at profit of 100 lakh, adds 20 depreciation, subtracts 50 working capital, shows 70 operating cash, subtracts 60 capex and ends at 10 free cash.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#222" stroke-width="1.3"/></marker></defs>
<rect width="760" height="320" fill="white"/>
<g fill="none" stroke="#222" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M61 260L719 260" /><path d="M61 50L61 260" /><path d="M57 260L61 260" /><path d="M57 180L61 180" /><path d="M57 100L61 100" /><rect x="90" y="100.0" width="64" height="160.0" /><rect x="193" y="68.0" width="64" height="32.0" /><rect x="296" y="68.0" width="64" height="80.0" /><rect x="399" y="148.0" width="64" height="112.0" /><rect x="502" y="148.0" width="64" height="96.0" /><rect x="605" y="244.0" width="64" height="16.0" /><path d="M154 100L193 100" stroke-dasharray="3 5"/><path d="M257 68L296 68" stroke-dasharray="3 5"/><path d="M360 148L399 148" stroke-dasharray="3 5"/><path d="M463 148L502 148" stroke-dasharray="3 5"/><path d="M566 244L605 244" stroke-dasharray="3 5"/></g>
<g fill="#222" font-family="-apple-system,BlinkMacSystemFont,Arial,sans-serif"><text x="48" y="36" font-size="18" text-anchor="start" font-weight="400">₹ lakh · illustrative</text><text x="48" y="265" font-size="18" text-anchor="end" font-weight="400">0</text><text x="48" y="185" font-size="18" text-anchor="end" font-weight="400">50</text><text x="48" y="105" font-size="18" text-anchor="end" font-weight="400">100</text><text x="122" y="91.0" font-size="19" text-anchor="middle" font-weight="400">100</text><text x="122" y="289" font-size="18" text-anchor="middle" font-weight="400">Profit</text><text x="225" y="59.0" font-size="19" text-anchor="middle" font-weight="400">+20</text><text x="225" y="289" font-size="18" text-anchor="middle" font-weight="400">D&amp;A</text><text x="328" y="59.0" font-size="19" text-anchor="middle" font-weight="400">−50</text><text x="328" y="289" font-size="18" text-anchor="middle" font-weight="400">Working</text><text x="328" y="312" font-size="18" text-anchor="middle">capital</text><text x="431" y="139.0" font-size="19" text-anchor="middle" font-weight="400">70</text><text x="431" y="289" font-size="18" text-anchor="middle" font-weight="400">Op. cash</text><text x="534" y="139.0" font-size="19" text-anchor="middle" font-weight="400">−60</text><text x="534" y="289" font-size="18" text-anchor="middle" font-weight="400">Capex</text><text x="637" y="235.0" font-size="19" text-anchor="middle" font-weight="400">10</text><text x="637" y="289" font-size="18" text-anchor="middle" font-weight="400">Free cash</text></g></svg>