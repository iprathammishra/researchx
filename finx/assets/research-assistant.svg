<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 605" role="img" aria-labelledby="title desc">
<title id="title">An analyst checks the research assistant</title>
<desc id="desc">The analyst asks retrieval a question. Dated passages reach the drafting model, which returns a draft with page citations. The analyst opens original documents, verifies numbers and context, and marks missing evidence.</desc>
<metadata>{&quot;kind&quot;: &quot;suggested sequence&quot;, &quot;participants&quot;: [&quot;analyst&quot;, &quot;retrieval&quot;, &quot;draft&quot;], &quot;messages&quot;: [{&quot;id&quot;: &quot;ask&quot;, &quot;from&quot;: &quot;analyst&quot;, &quot;to&quot;: &quot;retrieval&quot;, &quot;order&quot;: 1}, {&quot;id&quot;: &quot;retrieve&quot;, &quot;from&quot;: &quot;retrieval&quot;, &quot;to&quot;: &quot;draft&quot;, &quot;order&quot;: 2}, {&quot;id&quot;: &quot;return-draft&quot;, &quot;from&quot;: &quot;draft&quot;, &quot;to&quot;: &quot;analyst&quot;, &quot;order&quot;: 3}, {&quot;id&quot;: &quot;verify&quot;, &quot;from&quot;: &quot;analyst&quot;, &quot;to&quot;: &quot;retrieval&quot;, &quot;order&quot;: 4}], &quot;review&quot;: [&quot;numbers&quot;, &quot;context&quot;, &quot;missing evidence&quot;]}</metadata>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#222" stroke-width="1.4"/></marker></defs>
