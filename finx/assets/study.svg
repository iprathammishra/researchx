<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 380" role="img" aria-labelledby="title desc">
<title id="title">Attempt, repair and retest</title>
<desc id="desc">Three calendar leaves show attempt on day 1, error explanation on day 3 and a variation on day 7. Arrows visit each stage in order. If the variation is still wrong, a return path goes back to the idea. These gaps are illustrative.</desc>
<metadata>{&quot;kind&quot;: &quot;suggested feedback workflow&quot;, &quot;nodes&quot;: [&quot;attempt&quot;, &quot;repair&quot;, &quot;retest&quot;], &quot;edges&quot;: [{&quot;id&quot;: &quot;attempt-to-repair&quot;, &quot;from&quot;: &quot;attempt&quot;, &quot;to&quot;: &quot;repair&quot;}, {&quot;id&quot;: &quot;repair-to-retest&quot;, &quot;from&quot;: &quot;repair&quot;, &quot;to&quot;: &quot;retest&quot;}, {&quot;id&quot;: &quot;retest-to-attempt&quot;, &quot;from&quot;: &quot;retest&quot;, &quot;to&quot;: &quot;attempt&quot;, &quot;condition&quot;: &quot;still wrong&quot;}]}</metadata>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#222" stroke-width="1.4"/></marker></defs>
<rect width="760" height="380" fill="white"/>
<g fill="none" stroke="#222" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
<rect id="attempt" x="55" y="105" width="160" height="105" rx="3" fill="white"/><path d="M55 133H215"/><path d="M87 94V115 M183 94V115"/><rect id="repair" x="300" y="105" width="160" height="105" rx="3" fill="white"/><path d="M300 133H460"/><path d="M332 94V115 M428 94V115"/><rect id="retest" x="545" y="105" width="160" height="105" rx="3" fill="white"/><path d="M545 133H705"/><path d="M577 94V115 M673 94V115"/><path d="M215 158H300" id="attempt-to-repair" marker-end="url(#arrow)"/><path d="M460 158H545" id="repair-to-retest" marker-end="url(#arrow)"/><path d="M705 158H735V295H25V158H55" id="retest-to-attempt" marker-end="url(#arrow)"/>
</g>
<g fill="#222" font-family="-apple-system,BlinkMacSystemFont,Arial,sans-serif">
<text x="55" y="45" font-size="23" text-anchor="start" font-weight="400">Let the error decide the next exercise.</text><text x="135" y="178" font-size="22" text-anchor="middle" font-weight="500">DAY 1</text><text x="135" y="245" font-size="19" text-anchor="middle" font-weight="400">Attempt</text><text x="380" y="178" font-size="22" text-anchor="middle" font-weight="500">DAY 3</text><text x="380" y="245" font-size="19" text-anchor="middle" font-weight="400">Explain the error</text><text x="625" y="178" font-size="22" text-anchor="middle" font-weight="500">DAY 7</text><text x="625" y="245" font-size="19" text-anchor="middle" font-weight="400">Solve a variation</text><text x="380" y="285" font-size="19" text-anchor="middle" font-weight="400">Still wrong? Return to the idea.</text><text x="55" y="340" font-size="18" text-anchor="start" font-weight="400">Illustrative gaps; adapt the spacing to your errors.</text>
</g>
</svg>
