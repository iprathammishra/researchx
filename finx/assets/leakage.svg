<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 310" role="img" aria-labelledby="title desc"><title id="title">The backtest versus the review meeting</title><desc id="desc">A rising backtest line celebrates 98 percent accuracy. A reviewer asks whether tomorrow's prices were in today's features. Original finx cartoon about data leakage.</desc><rect width="760" height="310" fill="white"/><g fill="none" stroke="#222" stroke-width="2"><rect x="1" y="1" width="758" height="308"/><path d="M380 1V309 M40 237H333 M40 237V80 M50 225L100 206L150 190L200 144L250 126L327 69"/><circle cx="455" cy="140" r="28"/><path d="M455 168V229 M455 180L414 210 M455 180L498 195 M455 229L431 271 M455 229L480 271"/><path d="M493 82H725V161H522L494 186V161Z"/></g><g font-family="-apple-system,Arial,sans-serif" fill="#222"><text x="24" y="35" font-size="16">ME, AFTER THE BACKTEST</text><text x="401" y="35" font-size="16">THE REVIEW MEETING</text><text x="68" y="99" font-size="25" font-weight="bold">98% accuracy!</text><text x="46" y="274" font-size="13">Surely the market has been solved.</text><text x="510" y="109" font-size="14">Were tomorrow’s prices</text><text x="510" y="133" font-size="14">in today’s features?</text></g></svg>
